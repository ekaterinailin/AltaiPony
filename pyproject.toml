[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "altaipony"
version = "2.1.2"
authors = [
  { name="Ekaterina Ilin", email="eilin@aip.de" },
]
description = "Flare science in Kepler and TESS light curves"
readme = "README.rst"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.15.1",
    "pybind11",
    "lightkurve>=2.4",
    "pandas>=2.0",
    "gatspy",
    "progressbar2>=3.51.4",
    "seaborn",
    "astropy>=5",
    "emcee",
    "corner",
    "scipy>1.5",
]

[project.urls]
Homepage = "https://github.com/ekaterinailin/AltaiPony"

[tool.setuptools]
packages = ["altaipony"]
include-package-data = true

[tool.setuptools.package-data]
altaipony = ["static/*.csv", "examples/kplr010002792-2010174085026_llc.fits"]
